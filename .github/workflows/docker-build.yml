on:
  push:
    branches: [dev]

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest flake8
      - name: Test
        run: pytest
      - name: Lint
        run: flake8 .